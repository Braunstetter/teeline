user_menu:
    picture_alt: 'User picture'

profile:
    headline: 'Profile'
    form:
        settings:
            email: 'Email address'
            submit: 'Save'
            firstName: 'First name'
            lastName: 'Last name'
            gender: 'Gender'
            picture:
                label: 'Picture'
                delete_label: 'Remove picture'
                change_label: 'Change picture'
