            help: 'No longer want to use our service? You can delete your account here. This action is not reversible. All information related to this account will be deleted permanently.'
            confirm:
                title: 'Delete my account'
                body: |
                    This action is <b>not reversible</b>. 
                    All information related to this account will be <b>deleted permanently</b>.
                confirm: 'Yes, delete!'
                cancel: 'Cancel'
            success:
                title: 'Account deleted'
                goodbye: 'Your account has been successfully deleted. We are sorry to see you go!'
