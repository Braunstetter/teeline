# The bundle's own German uses formal address, which this product does not.
# Keyed by the bundle's English source strings -- a covering test turns red if
# one of them ever changes and this override stops matching.
'The link in your email is expired. Please try to reset your password again.': 'Der Link ist abgelaufen. Fordere bitte einen neuen an.'
'The reset password link is invalid. Please try to reset your password again.': 'Der Link stimmt nicht. Fordere bitte einen neuen an.'
'You have already requested a reset password email. Please check your email or try again soon.': 'Du hast gerade schon einen Link angefordert. Schau in dein Postfach oder versuch es später noch einmal.'
